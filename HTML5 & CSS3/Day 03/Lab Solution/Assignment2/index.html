<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment2 of HTML5</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="img-container">
        <img src="./assets/imgs/super-mario-04.png" alt="" />
      </div>
      <div>
        <audio
          src="./assets/sounds/Super Mario Bros (NES) Music - Overworld Theme.mp3"
          controls
        ></audio>

        <div class="ctrl">
          <button class="ctrl-btns">play</button>
          <button class="ctrl-btns">pause</button>
          <button class="ctrl-btns">stop</button>
          <input type="range" min="0" value="0" />
        </div>
      </div>
    </div>

    <div class="sounds-srcs">
      <div
        class="sound"
        soundSrc="./assets/sounds/Super Mario Bros (NES) Music - Overworld Theme.mp3"
        imgSrc="./assets/imgs/super-mario-04.png"
      >
        Super Mario
      </div>
      <div
        class="sound"
        soundSrc="./assets/sounds/El-Ahly Hayatna.mp3"
        imgSrc="./assets/imgs/51uOSRpRvNL._SL500_._AC_SL500_.jpg"
      >
        El-Ahly Hayatna
      </div>
      <div
        class="sound"
        soundSrc="./assets/sounds/Garab Td5al El-Astad.mp3"
        imgSrc="./assets/imgs/خلفيات-صرو-الاهلى-المصري.jpg"
      >
        Garab Td5al El-Astad
      </div>
      <div
        class="sound"
        soundSrc="./assets/sounds/Men Talta Shemal.mp3"
        imgSrc="./assets/imgs/ca8a71107e0f9058436ffcf074169201.png"
      >
        Men Talta Shemal
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
