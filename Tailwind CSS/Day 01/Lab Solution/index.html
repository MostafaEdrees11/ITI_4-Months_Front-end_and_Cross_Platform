<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab solution of 1st day at Tailwind CSS</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body bg-gray-400>
    <div
      class="cart-container w-100 bg-white border border-gray-200 mx-auto my-8 rounded-lg"
    >
      <div class="flex flex-col justify-center items-center gap-2 p-5">
        <div
          class="size-20 rounded-full bg-linear-to-r from-purple-500 to-pink-500"
        ></div>
        <h2 class="mt-2 text-xl font-bold">Alex Johnson</h2>
        <p class="text-lg text-gray-500">@alexj</p>

        <div class="text-lg flex flex-col items-center text-gray-500">
          <p>Digital designer & photography enthusiast.</p>
          <p>Love to travel and capture moments.</p>
        </div>

        <div
          class="border-y border-gray-500 flex justify-around gap-12 text-xl m-4 px-8 py-4"
        >
          <div class="flex flex-col items-center">
            <span class="font-bold">247</span>
            <span>Posts</span>
          </div>

          <div class="flex flex-col items-center">
            <span class="font-bold">5.2K</span>
            <span>Followers</span>
          </div>

          <div class="flex flex-col items-center">
            <span class="font-bold">892</span>
            <span>Following</span>
          </div>
        </div>

        <div class="my-4 mx-2 flex gap-4">
          <button
            class="bg-blue-600 py-4 px-12 rounded-md text-xl text-white hover:cursor-pointer hover:bg-blue-200"
          >
            Follow
          </button>
          <button
            class="bg-gray-200 py-4 px-12 rounded-md text-xl hover:cursor-pointer hover:bg-gray-600"
          >
            Messgae
          </button>
        </div>
      </div>

      <div>
        <p class="mx-4 font-bold">Recent Photos</p>
        <div class="p-4 flex gap-2 justify-center flex-wrap">
          <div
            class="rounded-md w-26 h-26 bg-red-300 bg-linear-to-r from-green-200 to-green-600"
          ></div>
          <div
            class="rounded-md w-26 h-26 bg-blue-300 bg-linear-to-r from-orange-300 to-orange-500"
          ></div>
          <div
            class="rounded-md w-26 h-26 bg-red-300 bg-linear-to-r from-purple-500 to-pink-500"
          ></div>
          <div
            class="rounded-md w-26 h-26 bg-blue-300 bg-linear-to-r from-blue-300 to-blue-500"
          ></div>
          <div
            class="rounded-md w-26 h-26 bg-blue-300 bg-linear-to-r from-yellow-300 to-yellow-700"
          ></div>
          <div
            class="rounded-md w-26 h-26 bg-blue-300 bg-linear-to-r from-gray-300 to-gray-600"
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
