<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignmen1</title>

    <script src="jquery-3.7.1.js"></script>
    <script src="jquery-ui.js"></script>

    <style>
      div {
        margin: 16px;
        padding: 8px;
      }

      img {
        position: absolute;
      }

      p {
        position: absolute;
        top: 80px;
        color: green;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="./12.gif" alt="" style="" id="car" />
      <p></p>
    </div>

    <script>
      $("p").text($("img").prop("outerHTML"));
      function updateText() {
        $("p").text($("img").prop("outerHTML"));
      }
      $(document).ready(function () {
        $("img").animate({ right: `0px` }, 2000, updateText);
      });
    </script>
  </body>
</html>
